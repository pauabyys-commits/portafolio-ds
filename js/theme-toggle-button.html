<button id="theme-toggle" aria-label="Cambiar tema">
  <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<script>
(function () {
  var btn = document.getElementById("theme-toggle");
  var navbarNav = document.querySelector(".navbar-nav.navbar-nav-scroll") || document.querySelector(".navbar .navbar-nav");

  // Mueve el boton dentro del navbar, al final
  if (navbarNav && navbarNav.parentElement) {
    navbarNav.parentElement.appendChild(btn);
  }

  // Aplica el tema guardado (o claro por defecto)
  var savedTheme = localStorage.getItem("theme") || "light";
  if (savedTheme === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
  updateIcon(savedTheme);

  btn.addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    var next = current === "dark" ? "light" : "dark";

    if (next === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }

    localStorage.setItem("theme", next);
    updateIcon(next);
  });

  function updateIcon(theme) {
    document.getElementById("icon-sun").style.display = theme === "dark" ? "block" : "none";
    document.getElementById("icon-moon").style.display = theme === "dark" ? "none" : "block";
  }
})();
</script>
